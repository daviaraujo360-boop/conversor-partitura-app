<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partitura no iPhone</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Partitura IA">
    
    <!-- Apenas a biblioteca leve de renderização visual da partitura -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f2f2f7; color: #1c1c1e; margin: 0; padding: 20px 15px; }
        .container { background: #ffffff; padding: 20px; border-radius: 16px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { font-size: 20px; text-align: center; color: #007aff; margin-bottom: 20px; }
        .box { background: #f8f8fc; border: 1px solid #e5e5ea; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; }
        
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #c7c7cc;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 5px; }
        button { flex: 1; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-record { background: #ff3b30; color: white; }
        .btn-process { background: #34c759; color: white; }
        .btn-piano { background: #5856d6; color: white; margin-top: 10px; width: 100%; }
        .btn-download { background: #007aff; color: white; margin-top: 8px; width: 100%; }
        button:disabled { background: #d1d1d6; color: #8e8e93; }
        
        #statusMsg { font-size: 13px; font-weight: 600; color: #007aff; margin-top: 12px; text-align: center; display: none; word-break: break-word; }
        #paper { background: #fff; border: 1px solid #e5e5ea; border-radius: 10px; margin-top: 10px; display: flex; justify-content: center; overflow-x: auto; min-height: 140px; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎼 Conversor para iPhone</h1>

    <div class="box">
        <label>1. Áudio ou Gravação</label>
        <input type="file" id="audioInput" accept="audio/*">

        <div class="btn-group">
            <button id="recordBtn" class="btn-record">🎙️ Gravar Voz</button>
            <button id="processAudioBtn" class="btn-process" disabled>⚡ Processar</button>
        </div>

        <audio id="audioPlayer" controls style="display:none;"></audio>
        <div id="statusMsg"></div>
    </div>

    <div class="box">
        <label>2. Partitura & Acompanhamento</label>
        <div id="paper"></div>
        
        <button id="playPianoBtn" class="btn-piano" disabled>🎹 Tocar Acompanhamento (Piano)</button>
        <button id="downloadBtn" class="btn-download" disabled>💾 Baixar Partitura (PNG)</button>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audioInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const recordBtn = document.getElementById('recordBtn');
    const processAudioBtn = document.getElementById('processAudioBtn');
    const playPianoBtn = document.getElementById('playPianoBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const paper = document.getElementById('paper');

    let audioBuffer = null;
    let audioCtx = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let currentDetectedNotes = [];

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    // Leitura robusta de arquivo via FileReader para garantir funcionamento no iOS
    audioInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#007aff';
            statusMsg.innerText = "Carregando arquivo...";

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const ctx = getAudioContext();
                    const arrayBuffer = event.target.result;
                    
                    audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                    
                    audioPlayer.src = URL.createObjectURL(file);
                    audioPlayer.style.display = 'block';
                    processAudioBtn.disabled = false;

                    statusMsg.style.color = '#34c759';
                    statusMsg.innerText = "Áudio pronto! Clique em Processar.";
                } catch (err) {
                    console.error(err);
                    statusMsg.style.color = '#ff3b30';
                    statusMsg.innerText = "Erro ao decodificar áudio. Tente outro formato.";
                }
            };

            reader.readAsArrayBuffer(file);
        }
    });

    // Gravação via microfone
    recordBtn.addEventListener('click', async () => {
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/wav' });
                    audioPlayer.src = URL.createObjectURL(blob);
                    audioPlayer.style.display = 'block';

                    const ctx = getAudioContext();
                    const arrayBuffer = await blob.arrayBuffer();
                    audioBuffer = await ctx.decodeAudioData(arrayBuffer);

                    processAudioBtn.disabled = false;
                    statusMsg.style.display = 'block';
                    statusMsg.style.color = '#34c759';
                    statusMsg.innerText = "Gravação pronta! Clique em Processar.";
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerText = "⏹️ Parar";
                statusMsg.style.display = 'block';
                statusMsg.style.color = '#ff3b30';
                statusMsg.innerText = "Gravando...";
            } catch (err) {
                alert("Permissão do microfone negada.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.innerText = "🎙️ Gravar Voz";
            statusMsg.style.color = '#34c759';
        }
    });

    // Processamento do áudio e detecção de notas
    processAudioBtn.addEventListener('click', () => {
        if (!audioBuffer) return;

        statusMsg.style.display = 'block';
        statusMsg.style.color = '#007aff';
        statusMsg.innerText = "Analisando frequências...";

        setTimeout(() => {
            currentDetectedNotes = detectNotesLocal(audioBuffer);
            renderScore(currentDetectedNotes);

            playPianoBtn.disabled = false;
            downloadBtn.disabled = false;

            statusMsg.style.color = '#34c759';
            statusMsg.innerText = "Partitura gerada com sucesso!";
        }, 100);
    });

    // Tocar acompanhamento de Piano
    playPianoBtn.addEventListener('click', () => {
        if (!currentDetectedNotes.length) return;
        const ctx = getAudioContext();
        let now = ctx.currentTime;

        currentDetectedNotes.forEach((midiNote, index) => {
            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + (index * 0.4));

            gain.gain.setValueAtTime(0.001, now + (index * 0.4));
            gain.gain.exponentialRampToValueAtTime(0.25, now + (index * 0.4) + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + (index * 0.4) + 0.38);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now + (index * 0.4));
            osc.stop(now + (index * 0.4) + 0.4);
        });
    });

    // Download em PNG
    downloadBtn.addEventListener('click', () => {
        const svgElement = paper.querySelector('svg');
        if (!svgElement) return;

        const svgData = new XMLSerializer().serializeToString(svgElement);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();

        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            const a = document.createElement("a");
            a.download = "partitura-gerada.png";
            a.href = canvas.toDataURL("image/png");
            a.click();
        };

        img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
    });

    function detectNotesLocal(buffer) {
        const data = buffer.getChannelData(0);
        const sampleRate = buffer.sampleRate;
        const chunkSize = 4096;
        const detectedMidi = [];

        for (let i = 0; i < data.length; i += chunkSize) {
            const chunk = data.slice(i, i + chunkSize);
            const pitch = autoCorrelate(chunk, sampleRate);
            if (pitch !== -1) {
                const midi = Math.round(69 + 12 * Math.log2(pitch / 440));
                if (midi >= 48 && midi <= 84) {
                    detectedMidi.push(midi);
                }
            }
        }
        return detectedMidi.slice(0, 8);
    }

    function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;
        for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.02) return -1;

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
        for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

        buf = buf.slice(r1, r2);
        SIZE = buf.length;

        let c = new Array(SIZE).fill(0);
        for (let i = 0; i < SIZE; i++)
            for (let j = 0; j < SIZE - i; j++)
                c[i] = c[i] + buf[j] * buf[j + i];

        let d = 0; while (c[d] > c[d + 1]) d++;
        let maxval = -1, maxpos = -1;
        for (let i = d; i < SIZE; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        let T0 = maxpos;
        return sampleRate / T0;
    }

    function renderScore(midiNotes) {
        paper.innerHTML = '';
        const { Renderer, Stave, StaveNote, Voice, Formatter } = Vex.Flow;
        const renderer = new Renderer(paper, Renderer.Backends.SVG);
        renderer.resize(450, 140);
        const context = renderer.getContext();
        const stave = new Stave(10, 10, 400);
        stave.addClef("treble").addTimeSignature("4/4");
        stave.setContext(context).draw();

        const vexNotes = (midiNotes.length ? midiNotes : [60, 64, 67]).map(m => {
            const names = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
            const oct = Math.floor(m / 12) - 1;
            const noteName = names[m % 12];
            return new StaveNote({ keys: [`${noteName}/${oct}`], duration: "q" });
        });

        const voice = new Voice({ num_beats: vexNotes.length, beat_value: 4 });
        voice.addTickables(vexNotes);
        new Formatter().joinVoices([voice]).format([voice], 320);
        voice.draw(context, stave);
    }
</script>

</body>
</html>
