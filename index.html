<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonizador de Piano Universal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #1c1c1e; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #2c2c2e; padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; margin-bottom: 8px; color: #0a84ff; }
        p { font-size: 14px; color: #8e8e93; margin-bottom: 25px; }
        
        .upload-area { border: 2px dashed #0a84ff; border-radius: 16px; padding: 25px 15px; margin-bottom: 20px; background: #1c1c1e; cursor: pointer; }
        .upload-area input { display: none; }
        .upload-label { font-size: 15px; color: #0a84ff; font-weight: bold; cursor: pointer; word-break: break-all; }
        
        .mode-select { margin-bottom: 20px; text-align: left; }
        .mode-select label { font-size: 13px; color: #8e8e93; display: block; margin-bottom: 6px; }
        select { width: 100%; padding: 12px; border-radius: 10px; background: #3a3a3c; border: none; color: white; font-size: 15px; }

        .progress-box { background: #1c1c1e; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; }
        .progress-bar { background: #3a3a3c; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-fill { background: #30d158; height: 100%; width: 0%; transition: width 0.1s linear; }

        button { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; margin-bottom: 12px; }
        .btn-process { background: #30d158; color: #000000; }
        .btn-process:disabled { background: #3a3a3c; color: #8e8e93; cursor: not-allowed; }
        .btn-download { background: #0a84ff; color: #ffffff; display: none; }
        
        .status { font-size: 13px; color: #8e8e93; min-height: 18px; }
        .error-msg { color: #ff453a; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎹 Harmonizador Universal</h1>
    <p>Envie qualquer áudio (MP3, M4A, WAV, OGG, AAC) para gerar o acompanhamento de piano.</p>

    <div class="upload-area" onclick="document.getElementById('audioFile').click()">
        <!-- Aceita qualquer tipo de áudio sem restrição -->
        <input type="file" id="audioFile" accept="audio/*, .mp3, .m4a, .wav, .aac, .ogg, .caf, .flac">
        <div id="fileLabel" class="upload-label">📁 Clique para escolher o áudio</div>
    </div>

    <div class="mode-select">
        <label for="harmonyMode">Modo de Acompanhamento:</label>
        <select id="harmonyMode">
            <option value="chord">🎹 Acordes Harmônicos (Triades Completas)</option>
            <option value="melody">🎵 Seguir Melodia (Linha Única Afinada)</option>
        </select>
    </div>

    <button id="processBtn" class="btn-process" disabled>▶️ Processar Áudio</button>

    <div id="progressBox" class="progress-box">
        <div id="progressText" style="font-size: 13px;">Lendo arquivo...</div>
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <button id="downloadBtn" class="btn-download">⬇️ Baixar Música com Piano</button>
    
    <div id="statusText" class="status">Aguardando arquivo de áudio.</div>
</div>

<script>
    const audioFileInput = document.getElementById('audioFile');
    const fileLabel = document.getElementById('fileLabel');
    const harmonyModeSelect = document.getElementById('harmonyMode');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const statusText = document.getElementById('statusText');

    let selectedFile = null;
    let renderedBlob = null;

    audioFileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            fileLabel.innerText = `📄 ${selectedFile.name}`;
            processBtn.disabled = false;
            statusText.className = "status";
            statusText.innerText = "Arquivo selecionado com sucesso!";
            downloadBtn.style.display = "none";
        }
    });

    // Função de decodificação compatível com Safari/iOS/Android
    async function decodeAudioDataCompatible(arrayBuffer) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return new Promise((resolve, reject) => {
            audioCtx.decodeAudioData(
                arrayBuffer,
                (buffer) => resolve(buffer),
                (err) => reject(err)
            );
        });
    }

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        processBtn.disabled = true;
        downloadBtn.style.display = "none";
        progressBox.style.display = "block";
        statusText.className = "status";
        statusText.innerText = "Lendo e decodificando áudio...";
        progressFill.style.width = '10%';

        try {
            const arrayBuffer = await selectedFile.arrayBuffer();
            progressFill.style.width = '25%';
            
            // Decodifica o áudio usando o método compatível com iOS/Android
            const audioBuffer = await decodeAudioDataCompatible(arrayBuffer);
            
            statusText.innerText = "Gerando acompanhamento de piano...";
            progressFill.style.width = '40%';

            // Contexto offline para processamento rápido
            const offlineCtx = new OfflineAudioContext(
                audioBuffer.numberOfChannels,
                audioBuffer.length,
                audioBuffer.sampleRate
            );

            // 1. Canal da Música Original
            const originalSource = offlineCtx.createBufferSource();
            originalSource.buffer = audioBuffer;
            originalSource.connect(offlineCtx.destination);

            // 2. Análise de Frequência para gerar o piano
            const pcmData = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            const mode = harmonyModeSelect.value;
            
            const frameSize = Math.floor(sampleRate * 0.1); 
            const totalFrames = Math.floor(pcmData.length / frameSize);

            for (let i = 0; i < totalFrames; i++) {
                const start = i * frameSize;
                const bufferSegment = pcmData.subarray(start, start + frameSize);
                const pitch = autoCorrelate(bufferSegment, sampleRate);
                const time = start / sampleRate;

                if (pitch > 65 && pitch < 1000) {
                    const midiNote = Math.round(69 + 12 * Math.log2(pitch / 440));
                    
                    if (mode === 'chord') {
                        playPianoNote(offlineCtx, midiNote - 12, time, 0.25);
                        playPianoNote(offlineCtx, midiNote - 8, time, 0.2);
                        playPianoNote(offlineCtx, midiNote - 5, time, 0.2);
                    } else {
                        playPianoNote(offlineCtx, midiNote, time, 0.25);
                    }
                }

                if (i % 20 === 0) {
                    const percent = 40 + Math.floor((i / totalFrames) * 50);
                    progressFill.style.width = percent + '%';
                    progressText.innerText = `Analisando notas: ${percent}%`;
                }
            }

            originalSource.start(0);

            progressText.innerText = "Renderizando som final...";
            progressFill.style.width = '95%';

            const renderedBuffer = await offlineCtx.startRendering();
            renderedBlob = bufferToWave(renderedBuffer, renderedBuffer.length);

            progressFill.style.width = '100%';
            progressText.innerText = 'Concluído com sucesso!';
            statusText.innerText = 'Áudio pronto para download!';
            downloadBtn.style.display = "block";
            processBtn.disabled = false;

        } catch (err) {
            console.error("Erro na decodificação:", err);
            progressBox.style.display = "none";
            statusText.className = "status error-msg";
            statusText.innerText = "Não foi possível ler este áudio. Tente convertê-lo para MP3/WAV ou gravar direto pelo app.";
            processBtn.disabled = false;
        }
    });

    function playPianoNote(ctx, midiNote, startTime, duration) {
        const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    downloadBtn.addEventListener('click', () => {
        if (!renderedBlob) return;
        
        const url = URL.createObjectURL(renderedBlob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `musica-com-piano-acompanhante.wav`;
        
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }, 100);
    });

    function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;

        for (let i = 0; i < SIZE; i++) {
            const val = buf[i];
            rms += val * val;
        }
        rms = Math.sqrt(rms / SIZE);

        if (rms < 0.02) return -1;

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
        for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

        buf = buf.slice(r1, r2);
        SIZE = buf.length;

        let c = new Array(SIZE).fill(0);
        for (let i = 0; i < SIZE; i++)
            for (let j = 0; j < SIZE - i; j++)
                c[i] = c[i] + buf[j] * buf[j + i];

        let d = 0; while (c[d] > c[d + 1]) d++;
        let maxval = -1, maxpos = -1;
        for (let i = d; i < SIZE; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        let T0 = maxpos;

        return sampleRate / T0;
    }

    function bufferToWave(abuffer, len) {
        let numOfChan = abuffer.numberOfChannels,
            length = len * numOfChan * 2 + 44,
            out = new DataView(new ArrayBuffer(length)),
            channels = [], i, sample,
            offset = 0,
            pos = 0;

        function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

        setUint32(0x46464952);                         // "RIFF"
        setUint32(length - 8);                         
        setUint32(0x45564157);                         // "WAVE"
        setUint32(0x20746d66);                         // "fmt "
        setUint32(16);                                 
        setUint16(1);                                  // PCM
        setUint16(numOfChan);
        setUint32(abuffer.sampleRate);
        setUint32(abuffer.sampleRate * 2 * numOfChan); 
        setUint16(numOfChan * 2);                      
        setUint16(16);                                 
        setUint32(0x61746164);                         // "data"
        setUint32(length - pos - 4);                   

        for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

        while (pos < length) {
            for (i = 0; i < numOfChan; i++) {
                sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                out.setInt16(pos, sample, true);
                pos += 2;
            }
            offset++;
        }
        return new Blob([out], { type: "audio/wav" });
    }
</script>

</body>
</html>
