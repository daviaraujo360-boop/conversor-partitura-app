<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partitura no iPhone</title>
    <!-- Configurações nativas para o iOS (iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Partitura IA">
    
    <!-- Bibliotecas VexFlow -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f2f2f7; color: #1c1c1e; margin: 0; padding: 20px 15px; }
        .container { background: #ffffff; padding: 20px; border-radius: 16px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { font-size: 20px; text-align: center; color: #007aff; margin-bottom: 20px; }
        .box { background: #f8f8fc; border: 1px solid #e5e5ea; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; }
        input[type="file"], button { width: 100%; padding: 14px; margin-top: 5px; border-radius: 10px; border: 1px solid #c7c7cc; font-size: 16px; }
        
        .paste-zone {
            border: 2px dashed #007aff;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background: #eef6ff;
            color: #007aff;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
            cursor: pointer;
        }

        button { background: #007aff; color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:active { background: #0056b3; }
        button:disabled { background: #d1d1d6; color: #8e8e93; }
        #statusMsg { font-size: 13px; font-weight: 600; color: #007aff; margin-top: 10px; text-align: center; display: none; }
        #paper { background: #fff; border: 1px solid #e5e5ea; border-radius: 10px; margin-top: 10px; display: flex; justify-content: center; overflow-x: auto; min-height: 140px; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎼 Conversor para iPhone</h1>

    <div class="box">
        <label>1. Áudio (Arquivo ou Colar)</label>
        <input type="file" id="audioInput" accept="audio/*">
        
        <div class="paste-zone" id="pasteZone">
            📋 Toque longo e selecione <b>Colar</b> (ou pressione Ctrl+V) para enviar o áudio copiado
        </div>

        <audio id="audioPlayer" controls></audio>
        <button id="processAudioBtn" disabled>⚡ Processar no Celular</button>
        <div id="statusMsg">Analisando no processador do celular...</div>
    </div>

    <div class="box">
        <label>2. Partitura Gerada</label>
        <div id="paper"></div>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audioInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const processAudioBtn = document.getElementById('processAudioBtn');
    const statusMsg = document.getElementById('statusMsg');
    const paper = document.getElementById('paper');
    const pasteZone = document.getElementById('pasteZone');

    let audioBuffer = null;

    async function loadAudioFile(file) {
        if (!file || !file.type.startsWith('audio/')) {
            alert("Por favor, selecione ou cole um arquivo de áudio válido!");
            return;
        }
        audioPlayer.src = URL.createObjectURL(file);
        const arrayBuffer = await file.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        processAudioBtn.disabled = false;
        statusMsg.style.display = 'block';
        statusMsg.innerText = `Áudio "${file.name || 'Copiado'}" carregado com sucesso!`;
    }

    // Carregamento via seleção de arquivo
    audioInput.addEventListener('change', (e) => {
        if (e.target.files[0]) loadAudioFile(e.target.files[0]);
    });

    // Carregamento via Colar (Clipboard)
    window.addEventListener('paste', async (e) => {
        const items = (e.clipboardData || window.clipboardData).items;
        for (let item of items) {
            if (item.kind === 'file' && item.type.startsWith('audio/')) {
                const file = item.getAsFile();
                await loadAudioFile(file);
                break;
            }
        }
    });

    pasteZone.addEventListener('click', async () => {
        try {
            const clipboardItems = await navigator.clipboard.read();
            for (const item of clipboardItems) {
                const audioType = item.types.find(t => t.startsWith('audio/'));
                if (audioType) {
                    const blob = await item.getType(audioType);
                    await loadAudioFile(blob);
                    return;
                }
            }
            alert("Nenhum arquivo de áudio foi encontrado na área de transferência.");
        } catch (err) {
            alert("Dica: Use o atalho Ctrl+V ou faça toque longo no campo e selecione 'Colar'.");
        }
    });

    processAudioBtn.addEventListener('click', async () => {
        if (!audioBuffer) return;

        processAudioBtn.disabled = true;
        statusMsg.style.display = 'block';
        statusMsg.innerText = "Analisando notas no iPhone...";

        setTimeout(() => {
            const notes = detectNotesLocal(audioBuffer);
            renderScore(notes);
            statusMsg.innerText = "Concluído!";
            processAudioBtn.disabled = false;
        }, 150);
    });

    function detectNotesLocal(buffer) {
        const data = buffer.getChannelData(0);
        const sampleRate = buffer.sampleRate;
        const chunkSize = 4096;
        const detectedMidi = [];

        for (let i = 0; i < data.length; i += chunkSize) {
            const chunk = data.slice(i, i + chunkSize);
            const pitch = autoCorrelate(chunk, sampleRate);
            if (pitch !== -1) {
                const midi = Math.round(69 + 12 * Math.log2(pitch / 440));
                if (midi >= 48 && midi <= 84) {
                    detectedMidi.push(midi);
                }
            }
        }
        return detectedMidi.slice(0, 8);
    }

    function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;
        for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.02) return -1;

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
        for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

        buf = buf.slice(r1, r2);
        SIZE = buf.length;

        let c = new Array(SIZE).fill(0);
        for (let i = 0; i < SIZE; i++)
            for (let j = 0; j < SIZE - i; j++)
                c[i] = c[i] + buf[j] * buf[j + i];

        let d = 0; while (c[d] > c[d + 1]) d++;
        let maxval = -1, maxpos = -1;
        for (let i = d; i < SIZE; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        let T0 = maxpos;
        return sampleRate / T0;
    }

    function renderScore(midiNotes) {
        paper.innerHTML = '';
        const { Renderer, Stave, StaveNote, Voice, Formatter } = Vex.Flow;
        const renderer = new Renderer(paper, Renderer.Backends.SVG);
        renderer.resize(450, 140);
        const context = renderer.getContext();
        const stave = new Stave(10, 10, 400);
        stave.addClef("treble").addTimeSignature("4/4");
        stave.setContext(context).draw();

        const vexNotes = (midiNotes.length ? midiNotes : [60, 64, 67]).map(m => {
            const names = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
            const oct = Math.floor(m / 12) - 1;
            const noteName = names[m % 12];
            return new StaveNote({ keys: [`${noteName}/${oct}`], duration: "q" });
        });

        const voice = new Voice({ num_beats: vexNotes.length, beat_value: 4 });
        voice.addTickables(vexNotes);
        new Formatter().joinVoices([voice]).format([voice], 320);
        voice.draw(context, stave);
    }
</script>

</body>
</html>
