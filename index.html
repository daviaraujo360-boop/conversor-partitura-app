<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhamento de Piano em Tempo Real</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #1c1c1e; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #2c2c2e; padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; margin-bottom: 8px; color: #0a84ff; }
        p { font-size: 14px; color: #8e8e93; margin-bottom: 25px; }
        
        .note-display { background: #1c1c1e; border: 2px solid #0a84ff; border-radius: 16px; padding: 20px; margin-bottom: 25px; }
        .note-name { font-size: 56px; font-weight: bold; color: #30d158; }
        .frequency { font-size: 16px; color: #8e8e93; margin-top: 5px; }
        
        button { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; }
        .btn-start { background: #30d158; color: #000000; }
        .btn-stop { background: #ff453a; color: #ffffff; }
        
        .status { margin-top: 15px; font-size: 13px; color: #8e8e93; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎹 Piano Acompanhante</h1>
    <p>Cante no microfone e o piano tocará junto com a sua voz em tempo real.</p>

    <div class="note-display">
        <div id="noteName" class="note-name">--</div>
        <div id="freqDisplay" class="frequency">0.0 Hz</div>
    </div>

    <button id="toggleBtn" class="btn-start">🎙️ Iniciar Acompanhamento</button>
    <div id="statusText" class="status">Pronto para iniciar.</div>
</div>

<script>
    const toggleBtn = document.getElementById('toggleBtn');
    const noteNameEl = document.getElementById('noteName');
    const freqDisplayEl = document.getElementById('freqDisplay');
    const statusTextEl = document.getElementById('statusText');

    let audioCtx = null;
    let analyser = null;
    let microphone = null;
    let isRunning = false;
    let animationId = null;

    // Sintetizador do Piano
    let oscillator = null;
    let gainNode = null;

    const noteNames = ["Dó", "Dó#", "Ré", "Ré#", "Mi", "Fá", "Fá#", "Sol", "Sol#", "Lá", "Lá#", "Si"];

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function createPianoSound() {
        // Oscilador de onda suave simulando um timbre de piano/órgão leve
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        oscillator.type = 'triangle';
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
    }

    toggleBtn.addEventListener('click', async () => {
        if (!isRunning) {
            try {
                initAudio();
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                
                microphone.connect(analyser);

                createPianoSound();

                isRunning = true;
                toggleBtn.innerText = "⏹️ Parar Acompanhamento";
                toggleBtn.className = "btn-stop";
                statusTextEl.innerText = "Ouvindo sua voz...";

                detectPitch();
            } catch (err) {
                alert("Permissão do microfone negada ou erro ao iniciar áudio.");
                console.error(err);
            }
        } else {
            stopAudio();
        }
    });

    function stopAudio() {
        isRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
        
        if (oscillator) {
            oscillator.stop();
            oscillator.disconnect();
        }

        if (microphone && microphone.mediaStream) {
            microphone.mediaStream.getTracks().forEach(track => track.stop());
        }

        toggleBtn.innerText = "🎙️ Iniciar Acompanhamento";
        toggleBtn.className = "btn-start";
        statusTextEl.innerText = "Acompanhamento parado.";
        noteNameEl.innerText = "--";
        freqDisplayEl.innerText = "0.0 Hz";
    }

    function detectPitch() {
        const buffer = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buffer);

        const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

        if (pitch !== -1 && pitch >= 65 && pitch <= 1000) {
            // Converte a frequência em nota MIDI
            const midiNote = Math.round(69 + 12 * Math.log2(pitch / 440));
            const noteIndex = (midiNote % 12 + 12) % 12;
            const octave = Math.floor(midiNote / 12) - 1;

            noteNameEl.innerText = `${noteNames[noteIndex]}${octave}`;
            freqDisplayEl.innerText = `${pitch.toFixed(1)} Hz`;

            // Ajusta a frequência do piano instantaneamente com a voz
            oscillator.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.03);
            
            // Suaviza o volume conforme a voz canta
            gainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.05);
        } else {
            // Silencia o piano suavemente se você parar de cantar
            if (gainNode) {
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            }
        }

        if (isRunning) {
            animationId = requestAnimationFrame(detectPitch);
        }
    }

    // Algoritmo rápido de detecção de tom no tempo real
    function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;

        for (let i = 0; i < SIZE; i++) {
            const val = buf[i];
            rms += val * val;
        }
        rms = Math.sqrt(rms / SIZE);

        // Se o volume da voz for muito baixo, ignora ruídos de fundo
        if (rms < 0.015) return -1;

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
        for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

        buf = buf.slice(r1, r2);
        SIZE = buf.length;

        let c = new Array(SIZE).fill(0);
        for (let i = 0; i < SIZE; i++)
            for (let j = 0; j < SIZE - i; j++)
                c[i] = c[i] + buf[j] * buf[j + i];

        let d = 0; while (c[d] > c[d + 1]) d++;
        let maxval = -1, maxpos = -1;
        for (let i = d; i < SIZE; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        let T0 = maxpos;

        return sampleRate / T0;
    }
</script>

</body>
</html>
